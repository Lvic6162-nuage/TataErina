<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AICHA NEXUS SHOP</title>
    <style>
        /* 🌌 DESIGN ANIME CYBERPUNK NÉON */
        body { font-family: 'Impact', sans-serif; background: #05050a; color: #00ffff; padding: 10px; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .header { padding: 15px; background: linear-gradient(180deg, #ff0055 0%, rgba(5,5,10,0) 100%); border-bottom: 2px solid #ff0055; text-align: left; position: relative; margin-bottom: 15px;}
        .logo { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; }
        .subtitle { font-size: 11px; color: #8888aa; margin: 0; }

        /* Zone Horaires & Infos Fixe (Plus de pop-up qui bug) */
        .zone-horaires { background: #0d0e15; border: 1px dashed #00ffff; padding: 10px; border-radius: 6px; text-align: left; font-size: 11px; margin-bottom: 15px; font-family: sans-serif; }
        .zone-horaires strong { color: #ff0055; }

        /* Grille des Articles (2 Colonnes) */
        .grille-produits { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 5px; margin-bottom: 90px; }
        .produit-card { background: #0d0e15; border: 1px solid #202232; position: relative; padding: 8px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); display: flex; flex-direction: column; justify-content: space-between; height: 250px; }
        .produit-img { width: 100%; height: 110px; object-fit: cover; filter: hue-rotate(320deg) brightness(0.9); border: 1px solid #1a1b26; border-radius: 4px; }
        .produit-card h3 { font-size: 13px; margin: 6px 0 2px 0; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .select-option { width: 100%; padding: 6px; background: #141526; border: 1px solid #ff0055; color: #fff; font-size: 11px; margin-bottom: 6px; outline: none; }
        .prix-produit { color: #ff0055; font-weight: bold; font-size: 16px; margin-bottom: 6px; text-shadow: 0 0 5px rgba(255,0,85,0.5); }
        
        .btn-add { background: #00ffff; color: #000; border: none; padding: 8px; font-size: 11px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; }

        /* Barre de Contrôle Fixe en Bas (Panier toujours visible) */
        .hud-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0d0e15; border-top: 2px solid #00ffff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 500; box-shadow: 0 -5px 15px rgba(0,0,0,0.8); }
        .hud-total-info { text-align: left; }
        .hud-total-info span { font-size: 10px; color: #8888aa; display: block; }
        .hud-total-info strong { font-size: 18px; color: #00ffff; text-shadow: 0 0 5px #00ffff; }
        .btn-execute { background: #ff0055; color: #fff; border: none; padding: 10px 18px; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 0 10px #ff0055; text-decoration: none; text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- En-tête de la Marque -->
    <div class="header">
        <div class="logo">AICHA CORPS</div>
        <div class="subtitle">Parfums // Nexus Market</div>
    </div>

    <!-- 📊 ZONE INFOS & HORAIRES : TOUJOURS VISIBLE ICI -->
    <div class="zone-horaires">
        ⚙️ <strong>HORAIRES :</strong> LUNDI - SAMEDI : 10H00 - 20H00<br>
        📍 <strong>LIVRAISON :</strong> MAIN PROPRE (CENTRE-VILLE / GARE)
    </div>

    <!-- Grille des Parfums sur 2 Colonnes -->
    <div class="grille-produits">
        
        <!-- PARFUM 1 -->
        <div class="produit-card">
            <img class="produit-img" src="https://unsplash.com">
            <h3>AICHA #1</h3>
            <select class="select-option" onchange="majPrixCard(this)">
                <option value="5" data-txt="1 ML (+1ml Offert)">1 ML (+1ml Offert) — 5€</option>
                <option value="10" data-txt="3 ML (+1ml Offert)">3 ML (+1ml Offert) — 10€</option>
                <option value="15" data-txt="5 ML (+1ml Offert)">5 ML (+1ml Offert) — 15€</option>
                <option value="25" data-txt="10 ML (+1ml Offert)">10 ML (+1ml Offert) — 25€</option>
            </select>
            <div class="prix-produit">5.00 €</div>
            <button class="btn-add" onclick="injecterPanier('AICHA #1', this)">+ AJOUTER</button>
        </div>

        <!-- PARFUM 2 -->
        <div class="produit-card">
            <img class="produit-img" src="https://unsplash.com">
            <h3>AICHA #2</h3>
            <select class="select-option" onchange="majPrixCard(this)">
                <option value="5" data-txt="1 ML (+1ml Offert)">1 ML (+1ml Offert) — 5€</option>
                <option value="10" data-txt="3 ML (+1ml Offert)">3 ML (+1ml Offert) — 10€</option>
                <option value="15" data-txt="5 ML (+1ml Offert)">5 ML (+1ml Offert) — 15€</option>
                <option value="25" data-txt="10 ML (+1ml Offert)">10 ML (+1ml Offert) — 25€</option>
            </select>
            <div class="prix-produit">5.00 €</div>
            <button class="btn-add" onclick="injecterPanier('AICHA #2', this)">+ AJOUTER</button>
        </div>

        <!-- PARFUM 3 -->
        <div class="produit-card">
            <img class="produit-img" src="https://unsplash.com">
            <h3>AICHA #3</h3>
            <select class="select-option" onchange="majPrixCard(this)">
                <option value="5" data-txt="1 ML (+1ml Offert)">1 ML (+1ml Offert) — 5€</option>
                <option value="10" data-txt="3 ML (+1ml Offert)">3 ML (+1ml Offert) — 10€</option>
                <option value="15" data-txt="5 ML (+1ml Offert) — 15€</option>
                <option value="25" data-txt="10 ML (+1ml Offert)">10 ML (+1ml Offert) — 25€</option>
            </select>
            <div class="prix-produit">5.00 €</div>
            <button class="btn-add" onclick="injecterPanier('AICHA #3', this)">+ AJOUTER</button>
        </div>

        <!-- PARFUM 4 -->
        <div class="produit-card">
            <img class="produit-img" src="https://unsplash.com">
            <h3>AICHA #4</h3>
            <select class="select-option" onchange="majPrixCard(this)">
                <option value="5" data-txt="1 ML (+1ml Offert)">1 ML (+1ml Offert) — 5€</option>
                <option value="10" data-txt="3 ML (+1ml Offert)">3 ML (+1ml Offert) — 10€</option>
                <option value="15" data-txt="5 ML (+1ml Offert) — 15€</option>
                <option value="25" data-txt="10 ML (+1ml Offert) — 25€</option>
            </select>
            <div class="prix-produit">5.00 €</div>
            <button class="btn-add" onclick="injecterPanier('AICHA #4', this)">+ AJOUTER</button>
        </div>

    </div>

    <!-- 🛒 BARRE DU PANIER EN BAS -->
    <div class="hud-bar">
        <div class="hud-total-info">
            <span id="txt-compteur">0 PARFUM ENREGISTRÉ</span>
            <strong id="txt-somme">0.00 €</strong>
        </div>
        <button class="btn-execute" onclick="transmettreSysteme()">COMMANDER ⚡</button>
    </div>

    <script>
        let monPanier = [];

        function majPrixCard(select) {
            const val = parseFloat(select.value).toFixed(2);
            select.parentElement.querySelector('.prix-produit').innerText = `${val} €`;
        }

        function injecterPanier(nom, bouton) {
            const card = bouton.parentElement;
            const s = card.querySelector('.select-option');
            const o = s.options[s.selectedIndex];
            
            const texteTaille = o.getAttribute('data-txt');
            const prixNum = parseFloat(s.value);

            // Ajout sans bug iPhone
            monPanier.push({ nom: nom, taille: texteTaille, prix: prixNum });
            
            // Mise à jour de la barre du bas immédiate
            document.getElementById('txt-compteur').innerText = `${monPanier.length} PARFUM(S) SÉLECTIONNÉ(S)`;
            document.getElementById('txt-somme').innerText = `${monPanier.reduce((sum, i) => sum + i.prix, 0).toFixed(2)} €`;

            // Changement de style temporaire du bouton
            bouton.innerText = "AJOUTÉ ! ✓";
            bouton.style.background = "#ff0055";
            bouton.style.color = "#fff";
            setTimeout(() => {
                bouton.innerText = "+ AJOUTER";
                bouton.style.background = "#00ffff";
                bouton.style.color = "#000";
            }, 600);
        }

        function transmettreSysteme() {
            if (monPanier.length === 0) { alert("VOTRE PANIER EST VIDE !"); return; }
            
            let t = `🚨 [NOUVELLE COMMANDE PARFUM] :\n`;
            let total = 0;
            monPanier.forEach((i) => {
                t += `• ${i.nom} (${i.taille}) — ${i.prix.toFixed(2)}€\n`;
                total += i.prix;
            });
            t += `\n💰 TOTAL : ${total.toFixed(2)}€\n⚡ EN MAIN PROPRE.`;
            
            // Envoi ultra stable par le système de partage de Telegram
            window.open(`https://t.me{encodeURIComponent(t)}`, '_blank');
        }
    </script>
</body>
</html>
